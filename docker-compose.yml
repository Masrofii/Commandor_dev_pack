version: '3.9'
services:
  api:
    build: { context: ., target: runner }
    container_name: commandor-api
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - commandor-data:/app/data
      - commandor-uploads:/app/uploads
      - commandor-backups:/app/backups
      - commandor-logs:/app/logs
      - commandor-exports:/app/exports
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/app.db
      - UPLOAD_DIR=/app/uploads
      - BACKUP_DIR=/app/backups
      - LOG_DIR=/app/logs
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://localhost:3000/health',r=>r.statusCode===200?process.exit(0):process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [commandor-net]
  web:
    build: { context: ./web }
    container_name: commandor-web
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3001"]
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - PORT=3001
    networks: [commandor-net]
    depends_on:
      api: { condition: service_healthy }
volumes:
  commandor-data:
  commandor-uploads:
  commandor-backups:
  commandor-logs:
  commandor-exports:
networks:
  commandor-net: { driver: bridge }
